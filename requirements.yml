name: quakexnet
channels:
  - conda-forge

dependencies:
  # Python (3.9 works; 3.10/3.11 also fine and better supported)
  - python=3.11

  # Core scientific stack
  - numpy=1.26.4
  - scipy=1.13.1
  - pandas=2.2.3
  - matplotlib=3.9.4

  # Seismology
  - obspy=1.4.1

  - pip

  - pip:
      # --- Required for detection (EQ / PX / SU) -------------------------
      # CPU-only:  pip install torch --index-url https://download.pytorch.org/whl/cpu
      # CUDA 12.6: pip install torch --index-url https://download.pytorch.org/whl/cu126
      - torch==2.7.1
      - seisbench==0.10.2

      # --- Required for the location step (src/locate_events.py) ---------
      # enveloc (Wech, USGS): https://github.com/awech/enveloc
      # Pulls in cartopy + utm; if cartopy is painful via pip, install it
      # first with:  conda install -c conda-forge cartopy
      - enveloc==1.1.5

      # --- Optional: plotting / dashboards / notebooks -------------------
      - tqdm
      - plotly
      - folium
      - scikit-learn
      - umap-learn
      - hdbscan
      - jupyterlab

      # --- Optional: real-time REST service (src/app.py) -----------------
      - fastapi
      - uvicorn
      - pydantic

      # --- Optional: Google Sheets upload (utils/upload_to_gsheets.py) ---
      - gspread
      - gspread-dataframe
      - google-auth
